# Netlify: long cache for versioned static assets; HTML stays revalidatable so deploys show up quickly.
# https://docs.netlify.com/routing/headers/

[[headers]]
  for = "/assets/**"
  [headers.values]
    # Long cache; omit "immutable" because many files are not content-hashed (e.g. main.js).
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
